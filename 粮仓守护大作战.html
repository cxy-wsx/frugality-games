<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粮仓守护大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#1a1a2e;font-family:'Microsoft YaHei','PingFang SC',sans-serif;user-select:none;position:fixed;top:0;left:0;width:100%;height:100%;}
#gameContainer{position:absolute;top:50%;left:50%;width:960px;height:640px;box-shadow:0 0 40px rgba(0,0,0,.5);border-radius:12px;overflow:hidden;transform-origin:center center;transform:translate(-50%,-50%) scale(1);}
canvas{display:block;background:#87CEEB;}
/* 覆盖层 */
.overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);}
.overlay.hidden{display:none;}
.overlay h1{font-size:48px;color:#FFD700;text-shadow:3px 3px 0 #B8860B,0 0 20px rgba(255,215,0,.5);margin-bottom:10px;letter-spacing:4px;}
.overlay h2{font-size:22px;color:#fff;margin-bottom:30px;font-weight:normal;opacity:.9;}
.overlay .tips{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:20px 30px;margin-bottom:30px;max-width:560px;}
.overlay .tips p{color:#e0e0e0;font-size:16px;line-height:2;text-align:left;}
.overlay .tips p strong{color:#FFD700;}
.btn{padding:14px 50px;font-size:22px;font-weight:bold;color:#fff;background:linear-gradient(135deg,#FF6B35,#F7931E);border:none;border-radius:30px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 15px rgba(255,107,53,.4);font-family:inherit;}
.btn:hover{transform:scale(1.05);box-shadow:0 6px 25px rgba(255,107,53,.6);}
.btn:active{transform:scale(.98);}
.back-btn{position:absolute;top:10px;right:10px;z-index:6;background:rgba(0,0,0,.55);border:none;border-radius:8px;padding:6px 14px;color:#fff;font-size:14px;cursor:pointer;pointer-events:auto;font-family:inherit;transition:background .2s;}
.back-btn:hover{background:rgba(0,0,0,.8);}
/* 移动端虚拟方向键 */
#mobileControls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:6px;}
.mobile-row{display:flex;gap:6px;justify-content:center;}
.mobile-btn{width:52px;height:52px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.25);border-radius:12px;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;}
.mobile-btn:active{background:rgba(255,255,255,.15);}
/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none;}
.hud-item{background:rgba(0,0,0,.55);border-radius:8px;padding:8px 18px;color:#fff;font-size:18px;font-weight:bold;display:flex;align-items:center;gap:8px;}
.hud-item .icon{font-size:22px;}
#grainBarWrap{width:200px;height:16px;background:rgba(0,0,0,.4);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.3);}
#grainBar{height:100%;width:100%;background:linear-gradient(90deg,#FFD700,#FFA500);border-radius:8px;transition:width .3s;}
/* 科普弹窗 */
#eduTip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);border-radius:12px;padding:20px 30px;z-index:8;text-align:center;max-width:420px;opacity:0;pointer-events:none;transition:opacity .4s;box-shadow:0 0 30px rgba(0,0,0,.3);}
#eduTip.show{opacity:1;}
#eduTip .edu-icon{font-size:36px;margin-bottom:8px;}
#eduTip p{font-size:17px;color:#333;line-height:1.6;}
#eduTip .source{font-size:13px;color:#888;margin-top:8px;}
/* 得分弹出 */
.scorePop{position:absolute;font-size:24px;font-weight:bold;color:#FFD700;text-shadow:2px 2px 0 #000;pointer-events:none;z-index:6;animation:scorePopAnim 1s ease-out forwards;}
@keyframes scorePopAnim{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-50px) scale(1.5);}}
/* 游戏结束 */
#gameOverBox{text-align:center;}
#gameOverBox .finalScore{font-size:60px;color:#FFD700;text-shadow:2px 2px 0 #B8860B;margin:10px 0;}
#gameOverBox .rank{font-size:28px;color:#fff;margin-bottom:10px;}
#gameOverBox .eduMsg{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:15px 25px;margin:20px 0;max-width:500px;}
#gameOverBox .eduMsg p{color:#FFD700;font-size:16px;line-height:1.8;}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas" width="960" height="640"></canvas>

<!-- HUD -->
<div id="hud" style="display:none;">
<div class="hud-item"><span class="icon">⭐</span><span>得分：<span id="scoreVal">0</span></span></div>
<div class="hud-item"><span class="icon">🌾</span>粮仓储量<div id="grainBarWrap"><div id="grainBar"></div></div></div>
<div class="hud-item"><span class="icon">⏱️</span><span id="timerVal">60</span>s</div>
</div>

<!-- 科普弹窗 -->
<div id="eduTip"><div class="edu-icon">🌾</div><p id="eduText"></p><div class="source">—— 勤俭节约科普小知识</div></div>

<!-- 返回按钮 -->
<button class="back-btn" id="backBtn" style="display:none;" onclick="goHome()">🏠 返回首页</button>

<!-- 移动端虚拟方向键 -->
<div id="mobileControls">
<div class="mobile-row"><div class="mobile-btn" data-key="ArrowUp">▲</div></div>
<div class="mobile-row"><div class="mobile-btn" data-key="ArrowLeft">◀</div><div class="mobile-btn" data-key="ArrowDown">▼</div><div class="mobile-btn" data-key="ArrowRight">▶</div></div>
</div>

<!-- 开始界面 -->
<div class="overlay" id="startScreen">
<h1>粮仓守护大作战</h1>
<h2>守护每一粒粮食，从你我做起</h2>
<div class="tips">
<p>🎮 <strong>操作方式：</strong>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 移动守护者（手机可触摸屏幕）</p>
<p>🐀 <strong>游戏目标：</strong>驱赶来袭的老鼠和害虫，保护粮仓中的粮食</p>
<p>🌾 <strong>得分规则：</strong>每驱赶一只害虫 <strong>+10分</strong>，粮食被偷吃则储量减少</p>
<p>⏱️ <strong>游戏时间：</strong>60秒，坚持到底就是胜利！</p>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
<button class="btn" onclick="startGame()">开始守护</button>
<button class="btn" onclick="goHome()" style="background:linear-gradient(135deg,#666,#888);box-shadow:0 4px 15px rgba(100,100,100,.4);">🏠 返回首页</button>
</div>
</div>

<!-- 游戏结束界面 -->
<div class="overlay hidden" id="gameOverScreen">
<div id="gameOverBox">
<h1 style="font-size:36px;">游戏结束</h1>
<div class="finalScore" id="finalScore">0</div>
<div class="rank" id="rankText"></div>
<div class="eduMsg"><p id="gameOverEdu"></p></div>
<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
<button class="btn" onclick="startGame()">再玩一次</button>
<button class="btn" onclick="goHome()" style="background:linear-gradient(135deg,#666,#888);box-shadow:0 4px 15px rgba(100,100,100,.4);">🏠 返回首页</button>
</div>
</div>
</div>
</div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const W=960,H=640;
const CX=W/2,CY=H/2;

let gameState='menu';
let score=0,grainHealth=100,timer=60,lastTime=0,spawnTimer=0,eduTimer=0;
let player,pests=[],particles=[],scorePops=[];
let keys={};

// 害虫类型
const pestTypes=[
{type:'rat',emoji:'🐀',size:36,speed:1.2,score:10,damage:8},
{type:'mouse',emoji:'🐭',size:30,speed:1.6,score:15,damage:6},
{type:'bug',emoji:'🐛',size:28,speed:2.0,score:20,damage:4},
{type:'ant',emoji:'🐜',size:24,speed:2.5,score:25,damage:3},
];

// 科普知识
const eduFacts=[
'全球每年约13亿吨粮食被浪费，相当于粮食总产量的三分之一。',
'中国每年餐饮浪费的粮食可供2亿人吃一年。',
'一粒水稻从播种到收获需要120天的辛勤劳作。',
'节约一粒粮食，就是尊重一位农民的汗水。',
'全球仍有近8亿人处于饥饿状态，珍惜粮食意义重大。',
'生产1公斤大米需要约2500升水，浪费粮食就是浪费水资源。',
'习近平总书记强调：坚决制止餐饮浪费行为，切实培养节约习惯。',
'光盘行动，从我做起，让节约成为生活方式。',
];

const gameOverEduMsgs=[
'感谢你守护粮仓！记住：每一粒粮食都来之不易。',
'你做到了！生活中也要光盘行动，拒绝浪费哦！',
'太棒了！节约粮食是中华民族的传统美德。',
'守护成功！请把珍惜粮食的理念传递给更多人。',
];

// 粮仓位置（中心区域）
const granaryRadius=70;

function startGame(){
score=0;grainHealth=100;timer=60;spawnTimer=0;eduTimer=0;
pests=[];particles=[];scorePops=[];
player={x:CX,y:CY+120,speed:4,size:40,facing:1,walkFrame:0};
gameState='playing';
document.getElementById('startScreen').classList.add('hidden');
document.getElementById('gameOverScreen').classList.add('hidden');
document.getElementById('hud').style.display='flex';
document.getElementById('backBtn').style.display='block';
if('ontouchstart' in window||navigator.maxTouchPoints>0){
document.getElementById('mobileControls').style.display='flex';
document.getElementById('mobileControls').style.flexDirection='column';
}
updateHUD();
scheduleEduTip();
requestAnimationFrame(gameLoop);
}

function goHome(){window.location.href='index.html';}

function scheduleEduTip(){
eduTimer=8+Math.random()*7; // 8-15秒后弹一次
}

function showEduTip(){
const fact=eduFacts[Math.floor(Math.random()*eduFacts.length)];
document.getElementById('eduText').textContent=fact;
const tip=document.getElementById('eduTip');
tip.classList.add('show');
setTimeout(()=>tip.classList.remove('show'),3500);
}

function updateHUD(){
document.getElementById('scoreVal').textContent=score;
document.getElementById('grainBar').style.width=grainHealth+'%';
document.getElementById('timerVal').textContent=Math.ceil(timer);
}

function spawnPest(){
const t=pestTypes[Math.floor(Math.random()*Math.min(pestTypes.length,1+Math.floor((60-timer)/15)))];
const side=Math.floor(Math.random()*4);
let x,y;
if(side===0){x=Math.random()*W;y=-30;}
else if(side===1){x=W+30;y=Math.random()*H;}
else if(side===2){x=Math.random()*W;y=H+30;}
else{x=-30;y=Math.random()*H;}
pests.push({...t,x,y,active:true,wobble:Math.random()*Math.PI*2,wobbleSpeed:0.05+Math.random()*0.05});
}

function updateGame(dt){
// 玩家移动
let dx=0,dy=0;
if(keys['ArrowLeft']||keys['a']||keys['A']){dx-=1;player.facing=-1;}
if(keys['ArrowRight']||keys['d']||keys['D']){dx+=1;player.facing=1;}
if(keys['ArrowUp']||keys['w']||keys['W'])dy-=1;
if(keys['ArrowDown']||keys['s']||keys['S'])dy+=1;
if(dx||dy){
const len=Math.sqrt(dx*dx+dy*dy);
dx/=len;dy/=len;
player.x+=dx*player.speed;
player.y+=dy*player.speed;
player.walkFrame+=0.2;
}
player.x=Math.max(player.size,Math.min(W-player.size,player.x));
player.y=Math.max(player.size,Math.min(H-player.size,player.y));

// 害虫移动 - 朝粮仓中心移动
for(let i=pests.length-1;i>=0;i--){
const p=pests[i];
if(!p.active)continue;
const tdx=CX-p.x,tdy=CY-p.y;
const dist=Math.sqrt(tdx*tdx+tdy*tdy);
p.wobble+=p.wobbleSpeed;
const wobbleX=Math.sin(p.wobble)*0.8;
p.x+=(tdx/dist)*p.speed+wobbleX;
p.y+=(tdy/dist)*p.speed;

// 害虫到达粮仓
if(dist<granaryRadius){
grainHealth-=p.damage;
createParticles(p.x,p.y,'#8B4513',8);
pests.splice(i,1);
if(grainHealth<=0){grainHealth=0;endGame();}
continue;
}
// 玩家驱赶害虫
const pdx=player.x-p.x,pdy=player.y-p.y;
const pdist=Math.sqrt(pdx*pdx+pdy*pdy);
if(pdist<player.size){
score+=p.score;
createParticles(p.x,p.y,'#FFD700',12);
addScorePop(p.x,p.y,'+'+p.score);
pests.splice(i,1);
}
}

// 生成害虫
spawnTimer+=dt;
const spawnRate=Math.max(0.6,1.8-(60-timer)*0.02);
if(spawnTimer>spawnRate){
spawnTimer=0;
spawnPest();
if(Math.random()<0.3&&timer<40)spawnPest();
}

// 粒子
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=dt;
if(p.life<=0)particles.splice(i,1);
}

// 得分弹出
for(let i=scorePops.length-1;i>=0;i--){
scorePops[i].y-=1.5;
scorePops[i].life-=dt;
if(scorePops[i].life<=0)scorePops.splice(i,1);
}

// 计时
timer-=dt;
if(timer<=0){timer=0;endGame();return;}

// 科普
eduTimer-=dt;
if(eduTimer<=0){showEduTip();scheduleEduTip();}

updateHUD();
}

function createParticles(x,y,color,count){
for(let i=0;i<count;i++){
const angle=Math.random()*Math.PI*2;
const speed=1+Math.random()*3;
particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2,life:0.6+Math.random()*0.4,color,size:2+Math.random()*4});
}
}

function addScorePop(x,y,text){
scorePops.push({x,y,text,life:1});
}

// 绘图函数
function drawBackground(){
// 天空渐变
const sky=ctx.createLinearGradient(0,0,0,H*0.6);
sky.addColorStop(0,'#87CEEB');
sky.addColorStop(1,'#E0F6FF');
ctx.fillStyle=sky;
ctx.fillRect(0,0,W,H*0.6);
// 草地
const grass=ctx.createLinearGradient(0,H*0.5,0,H);
grass.addColorStop(0,'#7CC576');
grass.addColorStop(1,'#4A9B4A');
ctx.fillStyle=grass;
ctx.fillRect(0,H*0.5,W,H*0.5);
// 远山
ctx.fillStyle='rgba(100,150,100,.4)';
ctx.beginPath();
ctx.moveTo(0,H*0.5);
ctx.quadraticCurveTo(W*0.25,H*0.35,W*0.5,H*0.5);
ctx.quadraticCurveTo(W*0.75,H*0.38,W,H*0.5);
ctx.lineTo(W,H*0.5);
ctx.fill();
// 云
ctx.fillStyle='rgba(255,255,255,.7)';
drawCloud(W*0.15,H*0.15,40);
drawCloud(W*0.7,H*0.1,50);
drawCloud(W*0.45,H*0.22,35);
// 栅栏
ctx.strokeStyle='#8B4513';
ctx.lineWidth=3;
for(let i=0;i<W;i+=40){
ctx.beginPath();ctx.moveTo(i,H*0.5);ctx.lineTo(i+15,H*0.5-20);ctx.stroke();
}
ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(0,H*0.5-8);ctx.lineTo(W,H*0.5-8);ctx.stroke();
}

function drawCloud(x,y,r){
ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.arc(x+r*0.8,y+r*0.2,r*0.7,0,Math.PI*2);
ctx.arc(x-r*0.8,y+r*0.2,r*0.7,0,Math.PI*2);
ctx.arc(x,y+r*0.3,r*0.6,0,Math.PI*2);
ctx.fill();
}

function drawGranary(){
// 粮仓底座阴影
ctx.fillStyle='rgba(0,0,0,.15)';
ctx.beginPath();ctx.ellipse(CX,CY+55,granaryRadius+15,15,0,0,Math.PI*2);ctx.fill();

// 粮仓主体
const gradBody=ctx.createLinearGradient(CX-60,0,CX+60,0);
gradBody.addColorStop(0,'#D4A055');
gradBody.addColorStop(0.5,'#E8B860');
gradBody.addColorStop(1,'#C49045');
ctx.fillStyle=gradBody;
ctx.fillRect(CX-60,CY-20,120,75);

// 粮仓砖纹
ctx.strokeStyle='rgba(139,69,19,.2)';
ctx.lineWidth=1;
for(let i=0;i<5;i++){
ctx.beginPath();ctx.moveTo(CX-60,CY-20+i*15);ctx.lineTo(CX+60,CY-20+i*15);ctx.stroke();
}

// 屋顶
ctx.fillStyle='#8B4513';
ctx.beginPath();
ctx.moveTo(CX-70,CY-20);
ctx.lineTo(CX,CY-70);
ctx.lineTo(CX+70,CY-20);
ctx.closePath();
ctx.fill();
// 屋顶高光
ctx.fillStyle='rgba(255,255,255,.15)';
ctx.beginPath();
ctx.moveTo(CX-70,CY-20);
ctx.lineTo(CX,CY-70);
ctx.lineTo(CX-30,CY-20);
ctx.closePath();
ctx.fill();

// 门
ctx.fillStyle='#6B3410';
ctx.fillRect(CX-18,CY+5,36,50);
ctx.beginPath();ctx.arc(CX,CY+5,18,0,Math.PI,0);ctx.fill();
// 门把手
ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(CX+10,CY+30,3,0,Math.PI*2);ctx.fill();

// 窗户
ctx.fillStyle='#87CEEB';
ctx.fillRect(CX-50,CY-5,18,18);
ctx.fillRect(CX+32,CY-5,18,18);
ctx.strokeStyle='#6B3410';ctx.lineWidth=2;
ctx.strokeRect(CX-50,CY-5,18,18);
ctx.strokeRect(CX+32,CY-5,18,18);
ctx.beginPath();ctx.moveTo(CX-41,CY-5);ctx.lineTo(CX-41,CY+13);ctx.stroke();
ctx.beginPath();ctx.moveTo(CX-50,CY+4);ctx.lineTo(CX-32,CY+4);ctx.stroke();
ctx.beginPath();ctx.moveTo(CX+41,CY-5);ctx.lineTo(CX+41,CY+13);ctx.stroke();
ctx.beginPath();ctx.moveTo(CX+32,CY+4);ctx.lineTo(CX+50,CY+4);ctx.stroke();

// 粮食堆（粮仓前方）
const grainAmount=grainHealth/100;
if(grainAmount>0){
ctx.fillStyle='#FFD700';
ctx.beginPath();
ctx.moveTo(CX-45,CY+55);
ctx.quadraticCurveTo(CX,CY+55-30*grainAmount,CX+45,CY+55);
ctx.fill();
// 麦粒细节
ctx.fillStyle='#FFA500';
for(let i=0;i<5;i++){
const px=CX-35+i*18;
const py=CY+50-grainAmount*15;
ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
}
}

// 粮仓标志
ctx.fillStyle='#fff';
ctx.font='bold 14px Microsoft YaHei';
ctx.textAlign='center';
ctx.fillText('粮 仓',CX,CY-35);
}

function drawPlayer(){
ctx.save();
ctx.translate(player.x,player.y);
ctx.scale(player.facing,1);
const bob=Math.sin(player.walkFrame)*2;
// 阴影
ctx.fillStyle='rgba(0,0,0,.2)';
ctx.beginPath();ctx.ellipse(0,22,18,5,0,0,Math.PI*2);ctx.fill();
// 身体
ctx.fillStyle='#4A90D9';
ctx.beginPath();ctx.ellipse(0,5+bob,16,20,0,0,Math.PI*2);ctx.fill();
// 头
ctx.fillStyle='#FFDBAC';
ctx.beginPath();ctx.arc(0,-15+bob,13,0,Math.PI*2);ctx.fill();
// 草帽
ctx.fillStyle='#D4A055';
ctx.beginPath();ctx.ellipse(0,-20+bob,20,6,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#C49045';
ctx.beginPath();ctx.ellipse(0,-25+bob,10,8,0,0,Math.PI*2);ctx.fill();
// 眼睛
ctx.fillStyle='#333';
ctx.beginPath();ctx.arc(4,-15+bob,2,0,Math.PI*2);ctx.fill();
// 嘴
ctx.strokeStyle='#333';ctx.lineWidth=1.5;
ctx.beginPath();ctx.arc(3,-11+bob,3,0,Math.PI);ctx.stroke();
// 手臂
ctx.fillStyle='#FFDBAC';
ctx.beginPath();ctx.arc(-14,0+bob,5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(14,0+bob,5,0,Math.PI*2);ctx.fill();
// 腿
ctx.fillStyle='#333';
ctx.fillRect(-8,20,5,10);
ctx.fillRect(3,20,5,10);
ctx.restore();

// 驱赶光环效果
ctx.strokeStyle='rgba(255,215,0,.3)';
ctx.lineWidth=2;
ctx.beginPath();ctx.arc(player.x,player.y,player.size+5,0,Math.PI*2);ctx.stroke();
}

function drawPest(p){
ctx.save();
ctx.translate(p.x,p.y);
const wobble=Math.sin(p.wobble)*0.1;
ctx.rotate(wobble);
ctx.font=p.size+'px serif';
ctx.textAlign='center';
ctx.textBaseline='middle';
// 阴影
ctx.fillStyle='rgba(0,0,0,.15)';
ctx.beginPath();ctx.ellipse(0,p.size*0.4,p.size*0.3,p.size*0.08,0,0,Math.PI*2);ctx.fill();
ctx.fillText(p.emoji,0,0);
ctx.restore();
}

function drawParticles(){
for(const p of particles){
ctx.globalAlpha=p.life;
ctx.fillStyle=p.color;
ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
}
ctx.globalAlpha=1;
}

function drawScorePops(){
ctx.font='bold 22px Microsoft YaHei';
ctx.textAlign='center';
for(const sp of scorePops){
ctx.globalAlpha=sp.life;
ctx.fillStyle='#FFD700';
ctx.strokeStyle='#000';ctx.lineWidth=3;
ctx.strokeText(sp.text,sp.x,sp.y);
ctx.fillText(sp.text,sp.x,sp.y);
}
ctx.globalAlpha=1;
}

function draw(){
ctx.clearRect(0,0,W,H);
drawBackground();
drawGranary();
// 害虫在粮仓后方绘制部分
for(const p of pests)drawPest(p);
drawPlayer();
drawParticles();
drawScorePops();
}

function gameLoop(timestamp){
if(gameState!=='playing')return;
const dt=Math.min((timestamp-lastTime)/1000,0.05);
lastTime=timestamp;
updateGame(dt);
draw();
requestAnimationFrame(gameLoop);
}

function endGame(){
gameState='gameover';
document.getElementById('hud').style.display='none';
document.getElementById('backBtn').style.display='none';
document.getElementById('mobileControls').style.display='none';
document.getElementById('finalScore').textContent=score;
let rank='';
if(score>=200)rank='🏆 粮仓守护神！';
else if(score>=120)rank='🥇 优秀守护者！';
else if(score>=60)rank='🥈 合格守护者';
else rank='🥉 继续加油！';
document.getElementById('rankText').textContent=rank;
document.getElementById('gameOverEdu').textContent=gameOverEduMsgs[Math.floor(Math.random()*gameOverEduMsgs.length)];
document.getElementById('gameOverScreen').classList.remove('hidden');
}

// 响应式缩放 - 确保画面始终居中且完整显示
function fitContainer(){
const cw=window.innerWidth,ch=window.innerHeight;
const scale=Math.min(cw/960,ch/640);
const container=document.getElementById('gameContainer');
container.style.transform='translate(-50%,-50%) scale('+scale+')';
}
window.addEventListener('resize',fitContainer);
window.addEventListener('orientationchange',function(){setTimeout(fitContainer,200);});
fitContainer();

// 键盘控制
document.addEventListener('keydown',e=>{
keys[e.key]=true;
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

// 虚拟按键（移动端）
document.querySelectorAll('.mobile-btn').forEach(btn=>{
const k=btn.dataset.key;
btn.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true;});
btn.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false;});
btn.addEventListener('mousedown',e=>{e.preventDefault();keys[k]=true;});
btn.addEventListener('mouseup',e=>{e.preventDefault();keys[k]=false;});
});

// 触摸控制（移动端直接触摸移动）
canvas.addEventListener('touchstart',e=>{
e.preventDefault();
const t=e.touches[0];
const rect=canvas.getBoundingClientRect();
const scaleX=W/rect.width,scaleY=H/rect.height;
player.x=(t.clientX-rect.left)*scaleX;
player.y=(t.clientY-rect.top)*scaleY;
});
canvas.addEventListener('touchmove',e=>{
e.preventDefault();
const t=e.touches[0];
const rect=canvas.getBoundingClientRect();
const scaleX=W/rect.width,scaleY=H/rect.height;
player.x=(t.clientX-rect.left)*scaleX;
player.y=(t.clientY-rect.top)*scaleY;
player.x=Math.max(player.size,Math.min(W-player.size,player.x));
player.y=Math.max(player.size,Math.min(H-player.size,player.y));
});
</script>
